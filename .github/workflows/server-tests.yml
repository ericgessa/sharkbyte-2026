# Runs the backend's offline tests on every push / pull request that touches the backend.
# The tests need no credentials (the live-database tests skip themselves), so this needs no repository secrets.
# NOT RUN ON GITHUB YET: the same command was verified locally with no .env and no SUPABASE_/TIGERDATA_ variables.
name: server tests

on:
  push:
    paths: ["server/**", "tigerdata/**", ".github/workflows/server-tests.yml"]
  pull_request:
    paths: ["server/**", "tigerdata/**", ".github/workflows/server-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
