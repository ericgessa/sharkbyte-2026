# Runs the backend's offline tests on every push / pull request that touches the backend.
# The tests need no credentials (the live-database tests skip themselves), so this needs no repository secrets.
# Also runs the mobile app's pure-TypeScript pose tests (Node 22.6+, no npm install needed) and, with that Node
# present, the backend's cross-language contract test.
# NOT RUN ON GITHUB YET: the same commands were verified locally with no .env and no SUPABASE_/TIGERDATA_ variables.
name: server tests

on:
  push:
    paths: ["server/**", "tigerdata/**", "mobile/src/pose/**", ".github/workflows/server-tests.yml"]
  pull_request:
    paths: ["server/**", "tigerdata/**", "mobile/src/pose/**", ".github/workflows/server-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: mobile pose tests
        working-directory: mobile
        run: npm run test:pose
